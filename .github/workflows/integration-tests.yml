name: Integration Tests

on:
  schedule:
    # Mondays 06:00 UTC. Detects API drift in Binance/Kraken/CoinGecko
    # between pushes; the main CI never runs these (network is flaky).
    - cron: "0 6 * * 1"
  workflow_dispatch:  # manual trigger for debugging

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev,data

      - name: Run integration tests
        run: uv run pytest -m integration tests/integration/ -v --no-cov -rs
        env:
          # Optional: only needed if any FX integration test requires
          # CoinGecko. Empty secret is fine; those tests skip.
          DATA__FX__COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
