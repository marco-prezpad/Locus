name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra mvp
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest --cov=locus --cov-report=term-missing --cov-fail-under=80

  docker-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target dev-cpu -t locus:dev-cpu .
      - run: docker run --rm locus:dev-cpu uv run python -m locus

  docker-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t locus:prod .
      - run: docker run --rm locus:prod python -m locus
