app:
  name: "locus"
  environment: "local"
  log_level: "INFO"

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  parquet_compression: "snappy"
  providers:
    binance:
      base_url: "https://api.binance.com"
      max_bars_per_request: 1000
      requests_per_minute: 1000
      timeout_seconds: 30
      max_retries: 5
    kraken:
      base_url: "https://api.kraken.com"
      max_bars_per_request: 720
      timeout_seconds: 30
      max_retries: 5
    coingecko:
      base_url: "https://api.coingecko.com/api/v3"
      timeout_seconds: 30
      max_retries: 3
      default_vs_currency: "usd"
  universe:
    discovery_source: "binance"
    min_history_days: 30
    default_venues: ["binance"]
  fx:
    pairs:
      - "EURUSD"
      - "USDTUSD"
    numeraire: "USDT"
    reporting_currency: "EUR"
    stale_days_threshold: 7
    coingecko_api_key: ""
    coingecko_max_per_minute: 100
    coingecko_max_per_month: 10000
    coingecko_warn_threshold: 9500
    source_preferences:
      EURUSD: ["frankfurter"]
      USDTUSD: ["kraken", "coingecko"]
  features:
    active:
      # Short-horizon context
      - {name: return_1, family: return, params: {n: 1}}
      - {name: return_24, family: return, params: {n: 24}}
      # Weekly horizon returns
      - {name: return_168, family: return, params: {n: 168}}
      - {name: return_336, family: return, params: {n: 336}}
      - {name: log_return_168, family: log_return, params: {n: 168}}
      # Trend at weekly scale
      - {name: ma_distance_168, family: ma_distance, params: {window: 168}}
      - {name: ma_distance_336, family: ma_distance, params: {window: 336}}
      - {name: ema_distance_168, family: ema_distance, params: {window: 168}}
      # Volatility at weekly scale
      - {name: rolling_vol_168, family: rolling_volatility, params: {window: 168}}
      - {name: atr_pct_168, family: atr_percent, params: {window: 168}}
      - {name: vol_ratio_24_168, family: volatility_ratio, params: {short_window: 24, long_window: 168}}
      # Volume at weekly scale
      - {name: volume_zscore_168, family: volume_zscore, params: {window: 168}}
      - {name: relative_volume_168, family: relative_volume, params: {window: 168}}
      # Cross-sectional at weekly horizon
      - {name: xs_percentile_return_168, family: xs_percentile_rank, params: {source: return_168}}
      - {name: xs_zscore_return_168, family: xs_zscore, params: {source: return_168}}
      - {name: rel_momentum_vs_market_168, family: relative_momentum, params: {source: return_168}}
    funding_active:
      - {name: funding_zscore_30d, family: funding_zscore, params: {window: 90}}
      - {name: funding_zscore_7d, family: funding_zscore, params: {window: 21}}
      - {name: funding_extreme_30d, family: funding_extreme, params: {source: funding_zscore_30d}}
      - {name: funding_trend_7d, family: funding_trend, params: {window: 21}}
      - {name: funding_xs_rank, family: funding_xs_rank, params: {source: funding_rate}}
      - {name: funding_xs_zscore, family: funding_xs_zscore, params: {source: funding_rate}}
  labels:
    horizons_bars:
      - {name: future_return_1d, bars: 24}
      - {name: future_return_1w, bars: 168}
      - {name: future_return_2w, bars: 336}
    probability_positive_label: future_return_1w
    primary_label: future_return_1w
  splits:
    mode: temporal
    temporal:
      train_ratio: 0.70
      val_ratio: 0.15
    walk_forward:
      n_splits: 5
      horizon_bars: 168
      lookback_bars: 168
      rebalance_freq_bars: 168
  funding:
    venue: "binance_futures"
    base_url: "https://fapi.binance.com"
    max_events_per_request: 1000
    timeout_seconds: 30
    max_retries: 5
    expected_cadence_hours: 8
    default_end_date: "2026-10-01"
    universe_assets: ["BTC", "ETH", "SOL", "BNB", "XRP"]

model:
  default_horizon_hours: 24
  random_seed: 42

portfolio:
  max_weight_per_asset: 0.10
  max_total_exposure: 1.0
  min_cash_weight: 0.05
  max_turnover: 0.30

risk:
  max_daily_loss_pct: 0.02
  max_drawdown_pct: 0.15
  kill_switch_enabled: true

backtest:
  fee_bps: 10.0
  spread_bps: 5.0
  slippage_bps: 5.0
  impact_model: "sqrt_volume"
  impact_k: 1.0
  initial_capital: 10000.0
  fee_schedule_version: "binance-spot-2026-01"

signal_execution:
  feature_compute_time: "bar_close_T"
  signal_availability_time: "bar_close_T"
  earliest_execution_time: "bar_open_T+1"
  rebalance_cadence_hours: 24
  rebalance_anchor: "00:00 UTC"
  holding_period_hours: 24
  signal_used_at_rebalance: "close_T-1"
  intermediate_signals_used_for_execution: false
  hysteresis_bps: 50.0
  execution_price: "bar_open_T+1"
