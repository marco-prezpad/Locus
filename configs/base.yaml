app:
  name: "locus"
  environment: "local"
  log_level: "INFO"

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  parquet_compression: "snappy"
  providers:
    binance:
      base_url: "https://api.binance.com"
      max_bars_per_request: 1000
      requests_per_minute: 1000
      timeout_seconds: 30
      max_retries: 5
    kraken:
      base_url: "https://api.kraken.com"
      max_bars_per_request: 720
      timeout_seconds: 30
      max_retries: 5
    coingecko:
      base_url: "https://api.coingecko.com/api/v3"
      timeout_seconds: 30
      max_retries: 3
      default_vs_currency: "usd"
  universe:
    discovery_source: "binance"
    min_history_days: 30
    default_venues: ["binance"]
  fx:
    pairs:
      - "EURUSD"
      - "USDTUSD"
    numeraire: "USDT"
    reporting_currency: "EUR"
    stale_days_threshold: 7
    coingecko_api_key: ""
    coingecko_max_per_minute: 100
    coingecko_max_per_month: 10000
    coingecko_warn_threshold: 9500
    source_preferences:
      EURUSD: ["frankfurter"]
      USDTUSD: ["kraken", "coingecko"]
  features:
    active:
      # --- Per-asset: returns ---
      - {name: return_1, family: return, params: {n: 1}}
      - {name: return_3, family: return, params: {n: 3}}
      - {name: return_5, family: return, params: {n: 5}}
      - {name: return_20, family: return, params: {n: 20}}
      - {name: return_50, family: return, params: {n: 50}}
      - {name: log_return_1, family: log_return, params: {n: 1}}
      - {name: log_return_5, family: log_return, params: {n: 5}}
      - {name: log_return_20, family: log_return, params: {n: 20}}
      # --- Per-asset: trend ---
      - {name: ma_distance_20, family: ma_distance, params: {window: 20}}
      - {name: ma_distance_50, family: ma_distance, params: {window: 50}}
      - {name: ema_distance_20, family: ema_distance, params: {window: 20}}
      - {name: ema_distance_50, family: ema_distance, params: {window: 50}}
      # --- Per-asset: volatility ---
      - {name: rolling_vol_5, family: rolling_volatility, params: {window: 5}}
      - {name: rolling_vol_20, family: rolling_volatility, params: {window: 20}}
      - {name: atr_pct_14, family: atr_percent, params: {window: 14}}
      - {name: vol_ratio_5_20, family: volatility_ratio, params: {short_window: 5, long_window: 20}}
      # --- Per-asset: volume ---
      - {name: volume_zscore_20, family: volume_zscore, params: {window: 20}}
      - {name: relative_volume_20, family: relative_volume, params: {window: 20}}
      # --- Cross-sectional (source must appear above) ---
      - {name: xs_percentile_return_20, family: xs_percentile_rank, params: {source: return_20}}
      - {name: xs_zscore_return_20, family: xs_zscore, params: {source: return_20}}
      - {name: xs_percentile_ma_distance_20, family: xs_percentile_rank, params: {source: ma_distance_20}}
      - {name: rel_momentum_vs_market_20, family: relative_momentum, params: {source: return_20}}

model:
  default_horizon_hours: 24
  random_seed: 42

portfolio:
  max_weight_per_asset: 0.10
  max_total_exposure: 1.0
  min_cash_weight: 0.05
  max_turnover: 0.30

risk:
  max_daily_loss_pct: 0.02
  max_drawdown_pct: 0.15
  kill_switch_enabled: true

backtest:
  fee_bps: 10.0
  spread_bps: 5.0
  slippage_bps: 5.0
  impact_model: "sqrt_volume"
  impact_k: 1.0
  initial_capital: 10000.0
  fee_schedule_version: "binance-spot-2026-01"

signal_execution:
  feature_compute_time: "bar_close_T"
  signal_availability_time: "bar_close_T"
  earliest_execution_time: "bar_open_T+1"
  rebalance_cadence_hours: 24
  rebalance_anchor: "00:00 UTC"
  holding_period_hours: 24
  signal_used_at_rebalance: "close_T-1"
  intermediate_signals_used_for_execution: false
  hysteresis_bps: 50.0
  execution_price: "bar_open_T+1"
