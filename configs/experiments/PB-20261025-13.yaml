# Pivote B reproduction config (P0 exit criterion).
# Re-executes the funding_zscore_30d, k=4, 168h/168h walk-forward
# documented as PB-20261025-13 in the registry. Used to verify the
# exit criterion "re-run pivote B from config, diff < 1e-9".

id: "PB-20261025-13"
thesis: "PB"
plan_version: "v3.1"
hypothesis: "U10, funding_zscore_30d, k=4, 168h/168h, central costs, walk-forward 3 folds"
universe: "U10"

feature:
  name: "funding_zscore_30d"
  window: 90

strategy:
  name: "FundingLongShortTopK"
  k: 4
  gross_exposure: 1.0
