    fee_bps: 10.0
    spread_bps: 5.0
    slippage_bps: 5.0
    impact_bps: 1.0
  pessimistic:
    fee_bps: 20.0
    spread_bps: 10.0
    slippage_bps: 10.0
    impact_bps: 2.0
  optimistic:
    fee_bps: 5.0
    spread_bps: 2.0
    slippage_bps: 2.0
    impact_bps: 0.5

