baseline: "buy_and_hold_btc"

criteria:
  e1_sharpe_above_baseline: 0.20
  e2_dsr_p_max: 0.05
  e3_folds_positive_min: 0.70
  e4_regimes_btc_non_negative: true
  e5_controls_abs_max: 0.20
  e6_concentration_max: 0.40
  e7_max_weight: 0.25
  e8_pessimistic_sharpe_min: 0.0
  e9_drawdown_max: 0.25
