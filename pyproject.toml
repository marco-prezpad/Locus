[project]
name = "locus"
version = "0.1.0"
description = "Autonomous multi-market quantitative trading system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.32",
    "pre-commit>=4.0",
]
data = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.12",
    "pyarrow>=18.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "tenacity>=9.0",
    "websockets>=13.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "optuna>=4.0",
]
dl = [
    "torch>=2.5",
    "transformers>=4.45",
    "accelerate>=1.1",
]
backtest = [
    "cvxpy>=1.6",
]
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
]
mlops = [
    "mlflow>=2.18",
]
notebooks = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
]
mvp = ["locus[dev,data,ml,backtest,dashboard,mlops]"]
all = ["locus[dev,data,ml,dl,backtest,dashboard,mlops,notebooks]"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["locus"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
include = ["src"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/.venv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers -m 'not integration' --cov=locus --cov-report=term-missing"
markers = [
    "unit: unit tests",
    "integration: integration tests (real APIs, network required)",
    "backtest: backtest tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locus"]

[tool.coverage.report]
skip_empty = true
